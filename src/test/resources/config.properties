# Committed defaults. Override any value at runtime via -D, e.g. `mvn test -Dbrowser=firefox`.
browser=chrome
headless=false
threads=3

# --- Environment selection ---
# Selects which config-{env}.properties overlay layers on top of these base defaults.
# Override at runtime, e.g. `mvn test -Denv=staging` loads config-staging.properties.
# Leave blank to run against these base defaults only.
env=qa

# --- Synchronization ---
# Explicit-wait ceiling (seconds) used by the page layer. Raise for slower environments.
explicit.wait.seconds=10

# --- Flaky-test retry ---
# Extra attempts for a failed test before it is reported as failed. 0 disables retries.
retry.count=1

# --- Mobile (Appium) ---
# platform=web (default) runs desktop browsers. Set platform=android for Appium runs
# (the `mobile` Maven profile sets this for you: `mvn test -Pmobile`).
platform=web
# androidTarget=web launches Chrome on the device; androidTarget=native launches an app.
androidTarget=web
# Native runs: set an .apk path OR an already-installed app's package + launch activity.
# app=C:/path/to/app.apk
# appPackage=com.example.app
# appActivity=com.example.app.MainActivity
# Optional: reuse an already-running Appium server instead of the self-managed one.
# appiumServerUrl=http://127.0.0.1:4723
# Optional: pin a device when several are connected (otherwise the single one is auto-selected).
# deviceUdid=emulator-5554

# --- API (REST Assured) ---
# Base URI for the API test suite. Override at runtime, e.g. `mvn test -DapiBaseUri=https://staging.example.com`.
apiBaseUri=https://jsonplaceholder.typicode.com
